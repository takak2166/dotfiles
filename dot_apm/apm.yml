# APM manifest (chezmoi → ~/apm.yml). Run: apm install
# Based on: https://github.com/takak2166/agent/blob/main/apm.yml.example

name: dotfiles
version: 1.0.0

# Limit apm install -g / apm compile -g to these harnesses.
# Without it, compile -g writes root context files for every known target.
targets:
  - claude
  - codex
  - cursor
  - opencode

dependencies:
  apm:
    - takak2166/agent

    - takak2166/agent/skills/check-pr-comment
