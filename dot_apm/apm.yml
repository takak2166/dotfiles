# APM manifest (chezmoi → ~/apm.yml). Run: apm install
# Based on: https://github.com/takak2166/agent/blob/main/apm.yml.example

name: dotfiles
version: 1.0.0

# Limit apm install -g / apm compile -g to these harnesses.
# Without it, compile -g writes root context files for every known target.
targets:
  - claude
  - codex
  - cursor
  - opencode

dependencies:
  apm:
    - takak2166/agent
    # The root package already deploys every skill under skills/. APM 0.36+ rejects
    # declaring a repository together with its own subdirectory packages (microsoft/apm#3699),
    # so skills are not listed one by one and the hook package uses an alias to install
    # outside apm_modules/takak2166/agent.
    # Cursor only: sessionStart hook that injects the always-on rules (reads ~/.claude/rules)
    - git: https://github.com/takak2166/agent.git
      path: packages/cursor-always-on-rules
      alias: cursor-always-on-rules

    - helpfeel/cosense-cli/skills/cosense#83229d89e14239d6c88506cca51c3cd3690eb46a # v1.18.0
    - github/gh-stack/skills/gh-stack#2a49e6751238633db504655d8a8eba3e433e827d # v0.3.0
